[package]
name = "ferrite-setup"
description = "One-click installer for the Ferrite mod loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Ferrite-Setup"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Globalization"] }

[lints]
workspace = true
