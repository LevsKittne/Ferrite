[package]
name = "ferrite-loader"
description = "Native bootstrap and mod runtime core for Unity Mono games"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "version"
crate-type = ["cdylib"]

[dependencies]
egui = "0.35"
egui-directx11 = "0.13"
ferrite-sdk = { version = "0.2.0", path = "../ferrite-sdk" }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
toml_edit = "0.25"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Environment", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Diagnostics_Debug"] }

[lints]
workspace = true
